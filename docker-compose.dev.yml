# Environment variables can be loaded from .env file in project root
# Example .env file:
# OPENAI_API_KEY=...
# ANTHROPIC_API_KEY=...

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalai-backend-dev
    ports:
      - "9001:9001"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://legalai:legalai123@postgres:5432/legalai
      - VECTOR_DB_TYPE=chroma
      - UPLOAD_DIR=./uploads
      - THUMBNAIL_DIR=./thumbnails
      - VECTOR_DB_DIR=./vector_db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/connected-apps/callback}
    volumes:
      # Mount source code for hot reload (excludes venv, __pycache__, etc. via .dockerignore)
      - type: bind
        source: ./backend
        target: /app
      # Ensure uploads, thumbnails, and vector_db persist
      - ./backend/uploads:/app/uploads
      - ./backend/thumbnails:/app/thumbnails
      - ./backend/vector_db:/app/vector_db
    restart: unless-stopped
    command: python run.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: legalai-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9001
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      - type: volume
        source: frontend-node-modules
        target: /app/node_modules
      - type: volume
        source: frontend-next
        target: /app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev

  postgres:
    image: postgres:15-alpine
    container_name: legalai-postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-legalai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-legalai123}
      - POSTGRES_DB=${POSTGRES_DB:-legalai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legalai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: legalai-pgadmin-dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@legalai.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: legalai-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # GPU support (optional - uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  frontend-node-modules:
  frontend-next:
  postgres_data:
  pgadmin_data:
  ollama_data:


