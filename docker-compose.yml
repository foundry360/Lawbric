  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped

  # ollama-service:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile.ollama-service
  #   container_name: legalai-ollama-service
  #   ports:
  #     - "8002:8002"
  #   environment:
  #     - OLLAMA_SERVICE_PORT=8002
  #     - OLLAMA_BASE_URL=http://ollama:11434
